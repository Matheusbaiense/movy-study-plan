<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movy Education – Simulador de Study Plan</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand: #15324f;
    --brand-light: #e8f0f8;
    --accent: #2563eb;
    --accent-light: #dbeafe;
    --success: #16a34a;
    --success-light: #dcfce7;
    --warn: #d97706;
    --warn-light: #fef3c7;
    --danger: #dc2626;
    --danger-light: #fee2e2;
    --elicos: #2563eb;
    --elicos-light: #dbeafe;
    --vet: #7c3aed;
    --vet-light: #ede9fe;
    --he: #0891b2;
    --he-light: #cffafe;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --gray-900: #0f172a;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    color: var(--gray-800);
    background: var(--gray-50);
    min-height: 100vh;
  }

  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: var(--brand);
    color: #fff;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar-brand { font-size: 16px; font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .save-status { font-size: 11px; color: rgba(255,255,255,.6); min-width: 64px; text-align: right; }

  .main { display: flex; flex: 1; gap: 0; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; }
  .sidebar-header h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--gray-500); }
  .sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--gray-200); }
  .sidebar-search input { width: 100%; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 6px 10px; font-size: 13px; color: var(--gray-800); background: var(--gray-50); outline: none; }
  .sidebar-search input:focus { border-color: var(--accent); background: #fff; }
  .plan-list { flex: 1; overflow-y: auto; }
  .plan-item { padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--gray-100); transition: background .1s; display: flex; align-items: center; gap: 10px; }
  .plan-item:hover { background: var(--gray-50); }
  .plan-item.active { background: var(--accent-light); }
  .plan-item.active .plan-name { color: var(--accent); font-weight: 500; }
  .plan-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-light); color: var(--brand); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .plan-item.active .plan-avatar { background: var(--accent); color: #fff; }
  .plan-meta { min-width: 0; }
  .plan-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--gray-700); }
  .plan-school { font-size: 11px; color: var(--gray-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Content */
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .tabs { background: #fff; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; gap: 0; padding: 0 20px; flex-shrink: 0; overflow-x: auto; }
  .tab-btn { padding: 14px 14px 12px; font-size: 13px; color: var(--gray-500); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; font-weight: 500; white-space: nowrap; }
  .tab-btn:hover { color: var(--gray-700); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-spacer { flex: 1; }
  .panel { flex: 1; overflow-y: auto; padding: 24px; }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-grid.cols-1 { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.span-2 { grid-column: span 2; }
  label { font-size: 12px; font-weight: 500; color: var(--gray-600); text-transform: uppercase; letter-spacing: .04em; }
  input, select, textarea { border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 8px 10px; font-size: 13px; color: var(--gray-800); background: #fff; outline: none; transition: border-color .15s; font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--gray-700); display: flex; align-items: center; gap: 8px; padding: 0 0 12px; border-bottom: 1px solid var(--gray-200); margin-bottom: 16px; }
  .section-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }

  /* Course block */
  .course-card { border-left: 4px solid var(--accent); }
  .course-card.t-elicos { border-left-color: var(--elicos); }
  .course-card.t-vet { border-left-color: var(--vet); }
  .course-card.t-he { border-left-color: var(--he); }
  .course-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .type-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .type-pill.t-elicos { background: var(--elicos-light); color: var(--elicos); }
  .type-pill.t-vet { background: var(--vet-light); color: var(--vet); }
  .type-pill.t-he { background: var(--he-light); color: var(--he); }
  .course-title-input { font-size: 15px; font-weight: 600; border: none; flex: 1; min-width: 160px; padding: 4px 0; }
  .course-title-input:focus { border-bottom: 1px solid var(--accent); }
  .course-num { font-size: 13px; font-weight: 700; color: var(--gray-900); }
  .course-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--gray-200); }
  .course-total-badge { font-size: 13px; color: var(--gray-600); }
  .course-total-badge strong { font-size: 16px; color: var(--brand); }

  /* Schedule / generic tables */
  .schedule-table, .cost-table { width: 100%; border-collapse: collapse; }
  .schedule-table th, .cost-table th { background: var(--gray-50); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--gray-500); padding: 8px 10px; text-align: left; border: 1px solid var(--gray-200); }
  .schedule-table td, .cost-table td { padding: 8px 10px; border: 1px solid var(--gray-200); font-size: 13px; }
  .schedule-table tr:nth-child(even) td { background: var(--gray-50); }
  .cost-table .total-row td { font-weight: 600; background: var(--gray-50); }
  .cost-table input, .schedule-table input { border: 1px solid var(--gray-200); background: #fff; padding: 4px 6px; font-size: 13px; border-radius: 4px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .aud-total { font-size: 18px; font-weight: 600; color: var(--brand); }

  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 500; }
  .badge-study { background: var(--accent-light); color: var(--accent); }
  .badge-holiday { background: var(--warn-light); color: var(--warn); }

  .add-row-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px dashed var(--gray-300); border-radius: var(--radius); background: none; color: var(--gray-500); cursor: pointer; font-size: 13px; margin-top: 10px; transition: all .15s; }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .add-course-btn { display: flex; gap: 8px; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .stat-card .s-label { font-size: 11px; color: var(--gray-500); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .stat-card .s-val { font-size: 20px; font-weight: 600; color: var(--gray-900); }

  .notice { background: var(--warn-light); border: 1px solid #fcd34d; border-radius: var(--radius); padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 16px; }
  .hint { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 12px 14px; font-size: 12px; color: var(--gray-500); }
  .del-row { background: none; border: none; cursor: pointer; color: var(--gray-400); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  .del-row:hover { color: var(--danger); background: var(--danger-light); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; border: 1px solid transparent; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: #fff; color: var(--gray-700); border-color: var(--gray-300); }
  .btn-secondary:hover { background: var(--gray-50); }
  .btn-danger { background: #fff; color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger-light); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-white { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.3); }
  .btn-white:hover { background: rgba(255,255,255,.25); }
  .btn-ghost { background: none; border-color: var(--gray-200); color: var(--gray-500); }
  .btn-ghost:hover { color: var(--accent); border-color: var(--accent); }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray-400); padding: 60px 20px; text-align: center; gap: 12px; }
  .empty-state h3 { font-size: 16px; color: var(--gray-600); }
  .empty-state p { font-size: 13px; max-width: 320px; line-height: 1.6; }

  /* Preview */
  .preview-wrapper { background: #fff; padding: 32px 40px; max-width: 780px; margin: 0 auto; }
  .preview-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .preview-logo-box { width: 44px; height: 44px; border-radius: 8px; background: var(--brand); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 800; letter-spacing: .02em; }
  .preview-logo-text h1 { font-size: 18px; font-weight: 700; color: var(--brand); }
  .preview-logo-text p { font-size: 12px; color: var(--gray-500); }
  .preview-divider { height: 2px; background: linear-gradient(90deg, var(--brand) 0%, var(--accent) 50%, transparent 100%); margin: 12px 0 20px; }
  .preview-title { font-size: 22px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
  .preview-subtitle { font-size: 14px; color: var(--gray-500); margin-bottom: 20px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .info-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--gray-400); }
  .info-value { font-size: 14px; color: var(--gray-800); font-weight: 500; }
  .preview-section { margin-bottom: 24px; }
  .preview-section h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--brand); border-bottom: 2px solid var(--brand); padding-bottom: 6px; margin-bottom: 12px; }
  .preview-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .preview-table th { background: var(--brand); color: #fff; padding: 7px 10px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .preview-table td { padding: 7px 10px; border-bottom: 1px solid var(--gray-200); }
  .preview-table tr:nth-child(even) td { background: var(--gray-50); }
  .preview-table .total-row td { font-weight: 700; background: var(--brand-light); color: var(--brand); }
  .summary-box { background: var(--brand); color: #fff; border-radius: var(--radius-lg); padding: 20px 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .sum-item h4 { font-size: 11px; font-weight: 500; opacity: .7; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .sum-item p { font-size: 20px; font-weight: 700; }
  .disclaimer { font-size: 11px; color: var(--gray-400); border-top: 1px solid var(--gray-200); padding-top: 12px; margin-top: 8px; text-align: center; }

  @media print {
    body { background: #fff; }
    .topbar, .sidebar, .tabs, .panel:not(.panel-preview) { display: none !important; }
    .panel-preview { padding: 0 !important; }
    .preview-wrapper { max-width: 100%; padding: 20px; }
    .print-hide { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="topbar-brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <rect width="24" height="24" rx="6" fill="rgba(255,255,255,0.2)"/>
      <path d="M5 18V7l4 6 4-6v11" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 7l4 11" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Movy Education · Study Plan
  </div>
  <div class="topbar-actions">
    <span class="save-status" id="save-status"></span>
    <button class="btn btn-white btn-sm" onclick="newPlan()">+ Novo plano</button>
    <button class="btn btn-white btn-sm" onclick="exportPDF()">↓ PDF</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Planos</h2>
      <span id="plan-count" style="font-size:12px;color:var(--gray-400)"></span>
    </div>
    <div class="sidebar-search">
      <input id="search-input" type="text" placeholder="Buscar por nome..." oninput="filterPlans()">
    </div>
    <div class="plan-list" id="plan-list"></div>
  </div>

  <div class="content" id="content">
    <div class="empty-state" id="empty-state">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
        <rect x="8" y="8" width="48" height="48" rx="8" stroke="#94a3b8" stroke-width="2" fill="none"/>
        <path d="M20 28H44M20 36H36M20 44H30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h3>Nenhum plano selecionado</h3>
      <p>Selecione um plano na lista ao lado ou crie um novo para começar a simular.</p>
      <button class="btn btn-primary" onclick="newPlan()">+ Criar novo plano</button>
    </div>
  </div>
</div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  Movy Education — Simulador / Criador de Study Plan
//  Persistência: localStorage. Login e nuvem ficam para uma etapa futura.
// ════════════════════════════════════════════════════════════════════════════

const LS_PLANS = 'movy_plans_v1';
const LS_PRESETS = 'movy_presets_v1';

const TYPES = {
  elicos: { label: 'ELICOS', icon: '🎓', unit: 'semanas' },
  vet:    { label: 'VET',    icon: '🛠', unit: 'programa' },
  he:     { label: 'Higher Ed', icon: '🏛', unit: 'programa' },
};

const APPLICANT_EXTRA_TEMPLATES = {
  Individual: [
    ['OSHC Single', 'oshc'],
    ['Student Visa Fee (main applicant)', 'visa'],
    ['Taxa Administrativa Movy', 'admin'],
    ['Medical Examination (if required)', 'medical'],
  ],
  Casal: [
    ['OSHC Couple', 'oshc'],
    ['Student Visa Fee (main applicant)', 'visa'],
    ['Dependent Visa Fee (+18)', 'visa'],
    ['Taxa Administrativa Movy', 'admin'],
    ['Medical Examination (if required)', 'medical'],
  ],
  'Família': [
    ['OSHC Family', 'oshc'],
    ['Student Visa Fee (main applicant)', 'visa'],
    ['Dependent Visa Fee (+18)', 'visa'],
    ['Dependent Visa Fee (-18)', 'visa'],
    ['Taxa Administrativa Movy', 'admin'],
    ['Medical Examination (if required)', 'medical'],
  ],
  'Single Parent': [
    ['OSHC Single Parent', 'oshc'],
    ['Student Visa Fee (main applicant)', 'visa'],
    ['Dependent Visa Fee (-18)', 'visa'],
    ['Taxa Administrativa Movy', 'admin'],
    ['Medical Examination (if required)', 'medical'],
  ],
};

const DEFAULT_PRESETS = [
  { type: 'elicos', provider: 'Language Links', name: 'General English', ratePerWeek: 260, materialFee: 250, enrolmentFee: 250, timetable: 'Morning / Evening', paymentParts: 4, paymentFrequency: 'A cada 6 semanas', depositWeeks: 3 },
  { type: 'elicos', provider: 'Language Links', name: 'English for IELTS and Academic Purposes (EIAP)', ratePerWeek: 260, materialFee: 250, enrolmentFee: 250, timetable: 'Evening / 3 days option', paymentParts: 4, paymentFrequency: 'A cada 6 semanas', depositWeeks: 3 },
  { type: 'elicos', provider: 'ILSC', name: 'General English / Academic English', ratePerWeek: 290, materialFee: 240, enrolmentFee: 250, timetable: 'Morning / Evening', paymentParts: 4, paymentFrequency: 'A cada 5-6 semanas', depositWeeks: 4 },
  { type: 'elicos', provider: 'Milner', name: 'General English', ratePerWeek: 260, materialFee: 250, enrolmentFee: 250, timetable: 'Morning / Evening', paymentParts: 4, paymentFrequency: 'A cada 6 semanas', depositWeeks: 3 },
  { type: 'elicos', provider: 'Lexis English', name: 'General English', ratePerWeek: 300, materialFee: 0, enrolmentFee: 250, timetable: 'Morning', paymentParts: 4, paymentFrequency: 'A cada 6 semanas', depositWeeks: 3 },
  { type: 'elicos', provider: 'Curtin English', name: 'ELB / Academic English', ratePerWeek: 0, materialFee: 0, enrolmentFee: 0, timetable: 'Morning', paymentParts: 1, paymentFrequency: 'A confirmar', depositWeeks: 0 },
  { type: 'vet', provider: 'Greystone College', name: 'Diploma of Project Management', tuition: 6400, enrolmentFee: 250, materialFee: 0, hasMaterial: false, paymentParts: 5, paymentFrequency: 'Mensal' },
  { type: 'vet', provider: 'Greenwich College', name: 'Diploma + Advanced Diploma pathway', tuition: 12000, enrolmentFee: 250, materialFee: 0, hasMaterial: false, paymentParts: 8, paymentFrequency: 'Mensal' },
  { type: 'vet', provider: 'Stanley College', name: 'Diploma of Community Services', tuition: 12000, enrolmentFee: 250, materialFee: 500, hasMaterial: true, paymentParts: 4, paymentFrequency: 'Por termo' },
  { type: 'vet', provider: 'NIT Australia', name: 'Advanced Diploma of Civil Construction Design', tuition: 0, enrolmentFee: 250, materialFee: 0, hasMaterial: false, paymentParts: 8, paymentFrequency: 'Mensal' },
  { type: 'vet', provider: 'TAFE', name: 'Certificate / Diploma', tuition: 0, enrolmentFee: 0, materialFee: 0, hasMaterial: false, paymentParts: 2, paymentFrequency: 'Por semestre' },
  { type: 'he', provider: 'ECU', name: 'Master program', tuition: 0, enrolmentFee: 0, scholarship: 0, paymentParts: 4, paymentFrequency: 'Por semestre' },
  { type: 'he', provider: 'Curtin University', name: 'Master program', tuition: 0, enrolmentFee: 0, scholarship: 0, paymentParts: 4, paymentFrequency: 'Por semestre' },
  { type: 'he', provider: 'Murdoch University', name: 'Master program', tuition: 0, enrolmentFee: 0, scholarship: 0, paymentParts: 4, paymentFrequency: 'Por semestre' },
  { type: 'he', provider: 'Kaplan Business School', name: 'Master of Business Analytics', tuition: 0, enrolmentFee: 0, scholarship: 0, paymentParts: 4, paymentFrequency: 'Por semestre' },
];

let plans = load(LS_PLANS, []).map(normalizePlan);
let presets = mergePresets(DEFAULT_PRESETS, load(LS_PRESETS, []));
let activePlanId = null;
let activeTab = 'dados';

// ─── Storage helpers ────────────────────────────────────────────────────────
function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
  catch { return fallback; }
}
function persist() {
  localStorage.setItem(LS_PLANS, JSON.stringify(plans));
  setSaveStatus('Salvo ✓');
  clearTimeout(persist._t);
  persist._t = setTimeout(() => setSaveStatus(''), 1200);
}
function persistPresets() { localStorage.setItem(LS_PRESETS, JSON.stringify(presets)); }
function setSaveStatus(t) { const el = document.getElementById('save-status'); if (el) el.textContent = t; }

function uid() { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function presetKey(p) { return [p.type, p.provider, p.name].map(x => (x || '').toLowerCase().trim()).join('|'); }
function mergePresets(base, saved) {
  const map = new Map();
  [...base, ...saved].forEach(p => map.set(presetKey(p), { ...p }));
  return [...map.values()];
}
function defaultPaymentParts(type) { return type === 'elicos' ? 4 : type === 'he' ? 4 : 6; }
function defaultPaymentFrequency(type) { return type === 'elicos' ? 'A cada 6 semanas' : type === 'he' ? 'Por semestre' : 'Mensal'; }
function normalizeCourse(c) {
  const type = c.type || 'elicos';
  return {
    id: c.id || uid(),
    type,
    provider: c.provider || '',
    name: c.name || '',
    url: c.url || '',
    timetable: c.timetable || '',
    start: c.start || '',
    enrolmentFee: n(c.enrolmentFee),
    scholarship: n(c.scholarship),
    ratePerWeek: n(c.ratePerWeek),
    materialFee: n(c.materialFee),
    hasMaterial: c.hasMaterial ?? type === 'vet',
    tuition: n(c.tuition),
    paymentParts: wk(c.paymentParts) || defaultPaymentParts(type),
    paymentFrequency: c.paymentFrequency || defaultPaymentFrequency(type),
    depositWeeks: wk(c.depositWeeks),
    segments: (c.segments || []).map(s => ({ label: s.label || 'Etapa', kind: s.kind || 'study', weeks: wk(s.weeks) })),
  };
}
function normalizePlan(p) {
  const visaType = p.visaType || 'Individual';
  return {
    ...p,
    id: p.id || uid(),
    student: p.student || 'Novo Estudante',
    visaType,
    courses: (p.courses || []).map(normalizeCourse),
    extraCosts: (p.extraCosts && p.extraCosts.length ? p.extraCosts : extraTemplateFor(visaType)).map(e => ({ id: e.id || uid(), item: e.item || '', category: e.category || 'other', amount: n(e.amount) })),
    payments: p.payments || [],
  };
}

// ─── Number / date helpers ──────────────────────────────────────────────────
function n(v) { return parseFloat(v) || 0; }
function wk(v) { return parseInt(v) || 0; }
function fmtAUD(v) { return 'AUD ' + n(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function addDays(iso, days) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function fmtDate(iso) { if (!iso) return '—'; const p = iso.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
function getInitials(name) { return (name || '?').trim().split(' ').filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('') || '?'; }
function esc(s) { return (s ?? '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// ─── Domain calculations (the simulator) ────────────────────────────────────
function courseStudyWeeks(c) { return (c.segments || []).filter(s => s.kind === 'study').reduce((a, s) => a + wk(s.weeks), 0); }
function courseHolidayWeeks(c) { return (c.segments || []).filter(s => s.kind === 'holiday').reduce((a, s) => a + wk(s.weeks), 0); }
function courseWeeks(c) { return (c.segments || []).reduce((a, s) => a + wk(s.weeks), 0); }

function courseTuition(c) {
  if (c.type === 'elicos') return courseStudyWeeks(c) * n(c.ratePerWeek);
  return n(c.tuition);
}
function courseMaterial(c) {
  if (c.type === 'he') return 0;
  if (c.type === 'vet' && !c.hasMaterial) return 0;
  return n(c.materialFee);
}
function courseTotal(c) {
  return n(c.enrolmentFee) + courseTuition(c) + courseMaterial(c) - n(c.scholarship);
}
function courseDeposit(c) {
  if (c.type === 'elicos') {
    const weeks = Math.min(courseStudyWeeks(c), wk(c.depositWeeks));
    return n(c.enrolmentFee) + courseMaterial(c) + weeks * n(c.ratePerWeek);
  }
  return n(c.enrolmentFee) + courseMaterial(c);
}
function coursePaymentBalance(c) { return Math.max(0, courseTotal(c) - courseDeposit(c)); }

function planVisaWeeks(plan) { return (plan.courses || []).reduce((a, c) => a + courseWeeks(c), 0); }
function planStudyWeeks(plan) { return (plan.courses || []).reduce((a, c) => a + courseStudyWeeks(c), 0); }
function planHolidayWeeks(plan) { return (plan.courses || []).reduce((a, c) => a + courseHolidayWeeks(c), 0); }

function planCoursesTotal(plan) { return (plan.courses || []).reduce((a, c) => a + courseTotal(c), 0); }
function planCourseDeposits(plan) { return (plan.courses || []).reduce((a, c) => a + courseDeposit(c), 0); }
function planPaymentBalance(plan) { return (plan.courses || []).reduce((a, c) => a + coursePaymentBalance(c), 0); }
function planExtrasTotal(plan) { return (plan.extraCosts || []).reduce((a, e) => a + n(e.amount), 0); }
function planGrandTotal(plan) { return planCoursesTotal(plan) + planExtrasTotal(plan); }

// Flatten courses → schedule rows with auto-chained dates.
function computeSchedule(plan) {
  let cursor = null;
  const rows = [];
  (plan.courses || []).forEach(c => {
    if (c.start) cursor = c.start;
    (c.segments || []).forEach((seg, segIdx) => {
      const start = cursor;
      const weeks = wk(seg.weeks);
      const end = start ? addDays(start, weeks * 7 - 1) : '';
      rows.push({ courseId: c.id, courseType: c.type, label: seg.label, kind: seg.kind, weeks, start, end });
      cursor = start ? addDays(end, 1) : null;
    });
  });
  return rows;
}
function planFirstStart(plan) { const c = (plan.courses || []).find(c => c.start); return c ? c.start : ''; }
function planNewVisaDate(plan) {
  const start = planFirstStart(plan);
  if (!start) return '';
  return addDays(start, planVisaWeeks(plan) * 7);
}

function courseProviders(p) { return (p.courses || []).map(c => c.provider).filter(Boolean).join(' · '); }

function blankCourse(type) {

    segments: [] };

  else base.segments = [{ label: TYPES[type].label, kind: 'study', weeks: 24 }, { label: 'Férias', kind: 'holiday', weeks: 4 }];
  return base;
}
function extraTemplateFor(visaType) {
  const rows = APPLICANT_EXTRA_TEMPLATES[visaType] || APPLICANT_EXTRA_TEMPLATES.Individual;
  return rows.map(([item, category]) => ({ id: uid(), item, category, amount: 0 }));
}
function defaultExtras() {
  return extraTemplateFor('Individual');
  return [
    { id: uid(), item: 'OSHC (Seguro Saúde)', category: 'oshc', amount: 0 },
    { id: uid(), item: 'Student Visa Fee', category: 'visa', amount: 0 },

  ];
}
function newPlan() {

    courses: [blankCourse('elicos')],

    payments: [],

}
function deletePlan(id) {

// ─── Tab: Custos (derived) ──────────────────────────────────────────────────
function renderCustos(plan) {
  const courseRows = (plan.courses || []).map(c => `
    <tr>
      <td><span class="type-pill t-${c.type}" style="font-size:10px;padding:2px 7px">${TYPES[c.type].label}</span> ${esc(c.provider ? c.provider + ' — ' : '')}${esc(c.name || '(sem nome)')}</td>
      <td class="num">${n(c.enrolmentFee) ? fmtAUD(c.enrolmentFee) : '–'}</td>
      <td class="num">${courseTuition(c) ? fmtAUD(courseTuition(c)) : '–'}</td>
      <td class="num">${courseMaterial(c) ? fmtAUD(courseMaterial(c)) : '–'}</td>
      <td class="num">${n(c.scholarship) ? '−' + fmtAUD(c.scholarship) : '–'}</td>
      <td class="num" style="font-weight:600">${fmtAUD(courseTotal(c))}</td>
    </tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--gray-400)">Nenhum curso.</td></tr>`;

  const extraRows = (plan.extraCosts || []).map((e, i) => `
    <tr>
      <td><input value="${esc(e.item)}" onchange="updateExtra(${i},'item',this.value)" style="width:100%;border:none;background:transparent"></td>
      <td><select onchange="updateExtra(${i},'category',this.value)" style="font-size:12px;padding:3px 6px;border:none;background:transparent">
        ${[['oshc', 'OSHC'], ['visa', 'Visto'], ['admin', 'Admin'], ['medical', 'Médico'], ['other', 'Outro']].map(([v, l]) => `<option value="${v}" ${e.category === v ? 'selected' : ''}>${l}</option>`).join('')}
      </select></td>
      <td class="num"><input type="number" step="0.01" value="${e.amount || 0}" onchange="updateExtraNum(${i},'amount',this.value)" style="width:110px;text-align:right;border:none;background:transparent;font-weight:500"></td>
      <td style="text-align:center"><button class="del-row" onclick="delExtra(${i})">✕</button></td>
    </tr>`).join('');

  return `
    <div class="card" style="padding:0;overflow:hidden">
      <table class="cost-table">
        <thead><tr><th>Curso</th><th class="num">Matrícula</th><th class="num">Mensalidade</th><th class="num">Material</th><th class="num">Bolsa/Desc.</th><th class="num">Total</th></tr></thead>
        <tbody>${courseRows}</tbody>
        <tfoot><tr class="total-row"><td colspan="5" style="font-weight:700;padding:10px">Subtotal cursos</td><td class="num" style="font-weight:700;padding:10px">${fmtAUD(planCoursesTotal(plan))}</td></tr></tfoot>
      </table>
    </div>

    <div class="section-title" style="margin-top:8px"><div class="dot"></div> Custos adicionais</div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="cost-table">
        <thead><tr><th>Item</th><th style="width:120px">Categoria</th><th class="num" style="width:140px">Valor AUD</th><th style="width:40px"></th></tr></thead>
        <tbody>${extraRows}</tbody>
        <tfoot><tr class="total-row"><td colspan="2" style="font-weight:700;padding:10px">Subtotal adicionais</td><td class="num" style="font-weight:700;padding:10px">${fmtAUD(planExtrasTotal(plan))}</td><td></td></tr></tfoot>
      </table>
    </div>
    <button class="add-row-btn" onclick="addExtra()">+ Adicionar custo</button>

    <div class="card" style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;background:var(--brand-light);border-color:var(--brand)">
      <span style="font-size:14px;font-weight:600;color:var(--brand)">TOTAL GERAL ESTIMADO</span>
      <span class="aud-total" style="font-size:24px">${fmtAUD(planGrandTotal(plan))}</span>
    </div>
    <div class="hint" style="margin-top:14px">Mensalidade do ELICOS e todos os totais calculam automaticamente. Edite os valores de mensalidade/material por curso na aba <b>Cursos</b>.</div>`;
}

// ─── Tab: Pagamento ─────────────────────────────────────────────────────────
function renderPagamento(plan) {
  const rows = (plan.payments || []).map((p, i) => `
    <tr>
      <td><input value="${esc(p.item)}" onchange="updatePay(${i},'item',this.value)" style="width:100%;border:none;background:transparent"></td>
      <td><input value="${esc(p.due)}" onchange="updatePay(${i},'due',this.value)" style="width:100%;border:none;background:transparent"></td>
      <td class="num"><input type="number" step="0.01" value="${p.amount || 0}" onchange="updatePayNum(${i},'amount',this.value)" style="width:110px;text-align:right;border:none;background:transparent;font-weight:500"></td>
      <td style="text-align:center"><button class="del-row" onclick="delPay(${i})">✕</button></td>
    </tr>`).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--gray-400)">Sem parcelas. Adicione ou gere automaticamente.</td></tr>`;
  const total = (plan.payments || []).reduce((a, p) => a + n(p.amount), 0);
  return `
    <div class="stat-row">
      <div class="stat-card"><div class="s-label">DepÃ³sito escolas</div><div class="s-val" style="font-size:16px">${fmtAUD(planCourseDeposits(plan))}</div></div>
      <div class="stat-card"><div class="s-label">OSHC/Visto/Extras</div><div class="s-val" style="font-size:16px">${fmtAUD(planExtrasTotal(plan))}</div></div>
      <div class="stat-card"><div class="s-label">Saldo cursos</div><div class="s-val" style="font-size:16px">${fmtAUD(planPaymentBalance(plan))}</div></div>
      <div class="stat-card"><div class="s-label">Total geral</div><div class="s-val" style="font-size:16px">${fmtAUD(planGrandTotal(plan))}</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn btn-secondary btn-sm" onclick="suggestPayments()">✨ Sugerir parcelamento</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table class="cost-table">
        <thead><tr><th>Item / Parcela</th><th>Data / Frequência</th><th class="num" style="width:140px">Valor AUD</th><th style="width:40px"></th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="total-row"><td colspan="2" style="font-weight:700;padding:10px">Total do plano de pagamento</td><td class="num aud-total" style="padding:10px">${fmtAUD(total)}</td><td></td></tr></tfoot>
      </table>
    </div>
    <button class="add-row-btn" onclick="addPay()">+ Adicionar parcela</button>
    <div class="notice" style="margin-top:14px">⚠️ As datas exatas serão confirmadas na carta de oferta.</div>`;
}

// ─── Tab: Prévia ────────────────────────────────────────────────────────────
function renderPreview(plan) {
  const sched = computeSchedule(plan);
  const schedRows = sched.map(r => `<tr><td>${esc(r.label)}</td><td>${fmtDate(r.start)}</td><td>${fmtDate(r.end)}</td><td class="num">${r.weeks}</td></tr>`).join('');
  const costRows = (plan.courses || []).map(c => `
    <tr><td>${esc(c.provider ? c.provider + ' — ' : '')}${esc(c.name)}</td>
      <td class="num">${n(c.enrolmentFee) ? fmtAUD(c.enrolmentFee) : '–'}</td>
      <td class="num">${courseTuition(c) ? fmtAUD(courseTuition(c)) : '–'}</td>
      <td class="num">${courseMaterial(c) ? fmtAUD(courseMaterial(c)) : '–'}</td>
      <td class="num">${n(c.scholarship) ? '−' + fmtAUD(c.scholarship) : '–'}</td>
      <td class="num" style="font-weight:600">${fmtAUD(courseTotal(c))}</td></tr>`).join('');
  const extraRows = (plan.extraCosts || []).filter(e => n(e.amount)).map(e => `<tr><td colspan="5">${esc(e.item)}</td><td class="num" style="font-weight:600">${fmtAUD(e.amount)}</td></tr>`).join('');
  const payRows = (plan.payments || []).map(p => `<tr><td>${esc(p.item)}</td><td>${esc(p.due) || 'A confirmar'}</td><td class="num" style="font-weight:600">${fmtAUD(p.amount)}</td></tr>`).join('');

  return `
    <div style="display:flex;gap:8px;margin-bottom:20px;justify-content:flex-end" class="print-hide">
      <button class="btn btn-secondary" onclick="window.print()">🖨 Imprimir</button>
      <button class="btn btn-primary" onclick="exportPDF()">↓ Salvar como PDF</button>
    </div>
    <div class="preview-wrapper">
      <div class="preview-logo">
        <div class="preview-logo-box">MV</div>
        <div class="preview-logo-text"><h1>Movy Education</h1>
          <p>${esc(plan.email || '')}${plan.phone ? ' · ' + esc(plan.phone) : ''}</p></div>
      </div>
      <div class="preview-divider"></div>
      <div class="preview-title">Planejamento de Estudos Personalizado</div>
      <div class="preview-subtitle">${plan.consultant ? 'Consultor: ' + esc(plan.consultant) : ''}</div>

      <div class="info-grid">
        <div><div class="info-label">Estudante</div><div class="info-value">${esc(plan.student)}</div></div>
        <div><div class="info-label">Tipo de Visto</div><div class="info-value">${esc(plan.visaType)}</div></div>
        ${(plan.courses || []).map(c => `<div><div class="info-label">${TYPES[c.type].label} · ${esc(c.provider)}</div><div class="info-value">${esc(c.name)}</div></div>`).join('')}
        ${plan.currentVisaExpiry ? `<div><div class="info-label">Venc. Visto Atual</div><div class="info-value">${fmtDate(plan.currentVisaExpiry)}</div></div>` : ''}
        ${planNewVisaDate(plan) ? `<div><div class="info-label">Novo Venc. Estimado*</div><div class="info-value">${fmtDate(planNewVisaDate(plan))}</div></div>` : ''}
      </div>

      <div class="summary-box">
        <div class="sum-item"><h4>Estudo</h4><p>${planStudyWeeks(plan)} sem</p></div>
        <div class="sum-item"><h4>Férias</h4><p>${planHolidayWeeks(plan)} sem</p></div>
        <div class="sum-item"><h4>Total visto</h4><p>${planVisaWeeks(plan)} sem</p></div>
        <div class="sum-item"><h4>Total estimado</h4><p style="font-size:16px">${fmtAUD(planGrandTotal(plan))}</p></div>
      </div>

      <div class="preview-section"><h3>Cronograma</h3>
        <table class="preview-table"><thead><tr><th>Etapa</th><th>Início</th><th>Término</th><th>Semanas</th></tr></thead><tbody>${schedRows}</tbody></table></div>

      <div class="preview-section"><h3>Custos</h3>
        <table class="preview-table">
          <thead><tr><th>Item</th><th>Matrícula</th><th>Mensalidade</th><th>Material</th><th>Bolsa</th><th>Total</th></tr></thead>
          <tbody>${costRows}${extraRows}</tbody>
          <tfoot><tr class="total-row"><td colspan="5"><strong>TOTAL ESTIMADO</strong></td><td class="num"><strong>${fmtAUD(planGrandTotal(plan))}</strong></td></tr></tfoot>
        </table></div>

      ${payRows ? `<div class="preview-section"><h3>Plano de Pagamento</h3>
        <table class="preview-table"><thead><tr><th>Item / Parcela</th><th>Data / Frequência</th><th>Valor</th></tr></thead><tbody>${payRows}</tbody></table>
        <div style="margin-top:8px;font-size:12px;color:var(--gray-500)">⚠️ As datas exatas serão confirmadas na carta de oferta.</div></div>` : ''}

      ${plan.notes ? `<div style="font-size:12px;color:var(--gray-500);background:var(--gray-50);border-radius:8px;padding:12px;margin-bottom:16px">${esc(plan.notes)}</div>` : ''}
      <div class="disclaimer">Documento estimativo, sujeito a alterações. Valores em AUD podem variar conforme câmbio. © Movy Education ${new Date().getFullYear()}</div>
    </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
//  Mutations
// ════════════════════════════════════════════════════════════════════════════
function updateField(field, val) { const p = getPlan(); if (!p) return; p[field] = val; persist(); if (field === 'student') renderSidebar(); if (field === 'visaType') renderContent(); }
function resetExtraCostsForVisa() {
  const p = getPlan(); if (!p) return;
  if ((p.extraCosts || []).some(e => n(e.amount)) && !confirm('Substituir os custos adicionais atuais pelo modelo deste tipo de visto?')) return;
  p.extraCosts = extraTemplateFor(p.visaType);
  persist(); renderContent();
}

function addCourse(type) { const p = getPlan(); if (!p) return; p.courses.push(blankCourse(type)); persist(); renderContent(); }
function delCourse(id) { const p = getPlan(); if (!p) return; p.courses = p.courses.filter(c => c.id !== id); persist(); renderContent(); renderSidebar(); }
function getCourse(id) { const p = getPlan(); return p && p.courses.find(c => c.id === id); }
function updateCourse(id, field, val) { const c = getCourse(id); if (!c) return; c[field] = val; persist(); renderContent(); }
function updateCourseNum(id, field, val) { const c = getCourse(id); if (!c) return; c[field] = n(val); persist(); renderContent(); }
function updateCourseBool(id, field, val) { const c = getCourse(id); if (!c) return; c[field] = val; persist(); renderContent(); }
function changeCourseType(id, type) {
  const c = getCourse(id); if (!c) return;
  c.type = type;
  if (type === 'he') c.materialFee = 0;
  if (type === 'vet' && c.hasMaterial === undefined) c.hasMaterial = true;
  c.paymentParts = defaultPaymentParts(type);
  c.paymentFrequency = defaultPaymentFrequency(type);
  c.depositWeeks = type === 'elicos' ? 3 : 0;
  persist(); renderContent();
}

function addSeg(id) { const c = getCourse(id); if (!c) return; c.segments.push({ label: 'Nova etapa', kind: 'study', weeks: 4 }); persist(); renderContent(); }
function delSeg(id, si) { const c = getCourse(id); if (!c) return; c.segments.splice(si, 1); persist(); renderContent(); }
function updateSeg(id, si, field, val) { const c = getCourse(id); if (!c) return; c.segments[si][field] = field === 'weeks' ? wk(val) : val; persist(); renderContent(); }

function addExtra() { const p = getPlan(); if (!p) return; p.extraCosts.push({ id: uid(), item: 'Novo custo', category: 'other', amount: 0 }); persist(); renderContent(); }
function delExtra(i) { const p = getPlan(); if (!p) return; p.extraCosts.splice(i, 1); persist(); renderContent(); }
function updateExtra(i, field, val) { const p = getPlan(); if (!p) return; p.extraCosts[i][field] = val; persist(); }
function updateExtraNum(i, field, val) { const p = getPlan(); if (!p) return; p.extraCosts[i][field] = n(val); persist(); renderContent(); }

function addPay() { const p = getPlan(); if (!p) return; (p.payments = p.payments || []).push({ item: 'Nova parcela', due: '', amount: 0 }); persist(); renderContent(); }
function delPay(i) { const p = getPlan(); if (!p) return; p.payments.splice(i, 1); persist(); renderContent(); }
function updatePay(i, field, val) { const p = getPlan(); if (!p) return; p.payments[i][field] = val; persist(); }
function updatePayNum(i, field, val) { const p = getPlan(); if (!p) return; p.payments[i][field] = n(val); persist(); renderContent(); }

// Suggest a basic payment plan: deposit (enrolment + extras) + per-course tuition installments.
function suggestPayments() {
  const p = getPlan(); if (!p) return;
  if (p.payments && p.payments.length && !confirm('Isto vai substituir o parcelamento atual. Continuar?')) return;
  const pay = [];
  const enrol = (p.courses || []).reduce((a, c) => a + n(c.enrolmentFee), 0);
  const extras = planExtrasTotal(p);
  pay.push({ item: 'Depósito (matrícula + OSHC + Visto + adicionais)', due: 'No fechamento', amount: enrol + extras });
  pay.length = 0;
  const courseDeposits = (p.courses || []).reduce((a, c) => a + courseDeposit(c), 0);
  if (courseDeposits) pay.push({ item: 'Depósito escolas (matrícula/material/entrada)', due: 'No fechamento', amount: courseDeposits });
  if (extras) pay.push({ item: 'OSHC + Visto + adicionais', due: 'No fechamento', amount: extras });
  (p.courses || []).forEach(c => {
    const remaining = coursePaymentBalance(c);
    const cad = c.paymentFrequency || defaultPaymentFrequency(c.type);
    const parts = Math.max(1, wk(c.paymentParts) || defaultPaymentParts(c.type));
    const each = Math.round((remaining / parts) * 100) / 100;
    for (let i = 1; i <= parts; i++) pay.push({ item: `${c.provider || TYPES[c.type].label} — Parcela ${i}`, due: i === 1 ? cad : '', amount: each });
  });
  p.payments = pay; persist(); renderContent();
}

// ─── Presets (the growing catalog) ──────────────────────────────────────────
function savePreset(id) {
  const c = getCourse(id); if (!c) return;
  if (!c.provider && !c.name) { alert('Preencha a escola e o nome do curso antes de salvar o preset.'); return; }
  const preset = { type: c.type, provider: c.provider, name: c.name, url: c.url, timetable: c.timetable,
    ratePerWeek: c.ratePerWeek, materialFee: c.materialFee, hasMaterial: c.hasMaterial, enrolmentFee: c.enrolmentFee, tuition: c.tuition,
    paymentParts: c.paymentParts, paymentFrequency: c.paymentFrequency, depositWeeks: c.depositWeeks };
  // replace if same provider+name+type
  const idx = presets.findIndex(p => p.type === preset.type && p.provider === preset.provider && p.name === preset.name);
  if (idx >= 0) presets[idx] = preset; else presets.push(preset);
  persistPresets(); renderContent();
  setSaveStatus('Preset salvo ✓'); setTimeout(() => setSaveStatus(''), 1500);
}
function applyPreset(id, idxStr) {
  const c = getCourse(id); if (!c || idxStr === '') return;
  const list = presets.filter(p => p.type === c.type);
  const preset = list[parseInt(idxStr)]; if (!preset) return;
  Object.assign(c, { provider: preset.provider, name: preset.name, url: preset.url, timetable: preset.timetable,
    ratePerWeek: preset.ratePerWeek, materialFee: preset.materialFee, hasMaterial: preset.hasMaterial,
    enrolmentFee: preset.enrolmentFee, tuition: preset.tuition, paymentParts: preset.paymentParts,
    paymentFrequency: preset.paymentFrequency, depositWeeks: preset.depositWeeks });
  persist(); renderContent(); renderSidebar();
}

function exportPDF() {
  if (activeTab !== 'preview') { activeTab = 'preview'; renderContent(); setTimeout(() => window.print(), 350); }
  else window.print();
}

// ─── Init ───────────────────────────────────────────────────────────────────
renderSidebar();
renderContent();
</script>
